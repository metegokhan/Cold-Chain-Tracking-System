<svg viewBox="0 0 1000 620" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a73e8"/><stop offset="100%" stop-color="#0d47a1"/></linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#34a853"/><stop offset="100%" stop-color="#1b5e20"/></linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ea4335"/><stop offset="100%" stop-color="#b71c1c"/></linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/></linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#4a148c"/></linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="16" fill="#f8f9fa"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#202124">Thermo_Obs: End-to-End System Operation &amp; Control Flow</text>
  <text x="500" y="58" text-anchor="middle" font-size="12" fill="#5f6368">What it checks • How it decides • Local 30-day LittleFS persistence • Cloud &amp; PDF outputs</text>

  <!-- SECTION 1: INPUTS (Left Column) -->
  <rect x="25" y="85" width="200" height="150" rx="10" fill="#fff" stroke="#dadce0" stroke-width="2" filter="url(#dropShadow)"/>
  <rect x="25" y="85" width="200" height="30" rx="10" fill="url(#blueGrad)"/>
  <text x="125" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">📡 Sensor Inputs</text>
  <text x="40" y="135" font-size="11" font-weight="bold" fill="#202124">• Xiaomi BLE Beacon:</text>
  <text x="48" y="152" font-size="10" fill="#5f6368">Temp, Hum, Bat %, Volt, RSSI</text>
  <text x="40" y="175" font-size="11" font-weight="bold" fill="#202124">• GPIO 4 (Mains Power):</text>
  <text x="48" y="192" font-size="10" fill="#5f6368">5V / 220V Outage Sensor</text>
  <text x="40" y="215" font-size="11" font-weight="bold" fill="#202124">• GPIO 9 (BOOT Button):</text>

  <rect x="25" y="255" width="200" height="155" rx="10" fill="#fff" stroke="#dadce0" stroke-width="2" filter="url(#dropShadow)"/>
  <rect x="25" y="255" width="200" height="30" rx="10" fill="url(#orangeGrad)"/>
  <text x="125" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">🔘 UI Navigation Logic</text>
  <text x="38" y="305" font-size="11" font-weight="bold" fill="#d84315">• Short Press (&lt; 1.5s):</text>
  <text x="48" y="322" font-size="10" fill="#5f6368">Cycles 8 screens; pauses BLE</text>
  <text x="38" y="345" font-size="11" font-weight="bold" fill="#d84315">• Long Press (&gt; 5.0s):</text>
  <text x="48" y="362" font-size="10" fill="#5f6368">Opens Config Menu (WPS, AP)</text>
  <text x="38" y="385" font-size="11" font-weight="bold" fill="#d84315">• 10s Inactivity:</text>
  <text x="48" y="400" font-size="10" fill="#5f6368">Auto-returns to Main Screen</text>

  <!-- SECTION 2: ESP32-C3 CORE DECISION ENGINE (Center Column) -->
  <rect x="260" y="85" width="450" height="495" rx="12" fill="#fff" stroke="#1a73e8" stroke-width="2" filter="url(#dropShadow)"/>
  <rect x="260" y="85" width="450" height="35" rx="12" fill="url(#blueGrad)"/>
  <text x="485" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">🧠 ESP32-C3 State Machine &amp; Local Persistence</text>

  <!-- Stage 1 -->
  <rect x="280" y="135" width="410" height="65" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="295" y="155" font-size="12" font-weight="bold" fill="#1a73e8">STAGE 1: BLE Acquisition (Wi-Fi OFF)</text>
  <text x="295" y="173" font-size="11" fill="#3c4043">Captures BTHome V2 beacon packets; decodes float values. Timeout: 185s.</text>
  <text x="295" y="190" font-size="10" fill="#70757a">↳ If timeout occurs: activates auto-discovery or submits empty telemetry packet.</text>

  <!-- Stage 2 -->
  <rect x="280" y="215" width="410" height="105" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="295" y="235" font-size="12" font-weight="bold" fill="#2e7d32">STAGE 2: Dual-Mode Wi-Fi Transmission &amp; Alarm Engine</text>
  <text x="295" y="253" font-size="11" fill="#3c4043">• Disconnects BLE radio; connects to Primary / Backup Wi-Fi station.</text>
  <text x="295" y="270" font-size="11" fill="#3c4043">• Synchronizes NTP internet clock (GMT+3) for exact timestamps.</text>
  <text x="295" y="287" font-size="11" font-weight="bold" fill="#c62828">• Limit Check: If Temp &lt; 2.0°C or &gt; 8.0°C ➔ Dispatches Telegram Alarm!</text>
  <text x="295" y="304" font-size="11" font-weight="bold" fill="#e65100">• Power Check: If GPIO 4 reads Outage ➔ Dispatches Mains Loss Alert!</text>

  <!-- Stage 3 -->
  <rect x="280" y="335" width="410" height="60" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
  <text x="295" y="355" font-size="12" font-weight="bold" fill="#3c4043">STAGE 3: Rest Window &amp; Low-Power (millis based)</text>
  <text x="295" y="373" font-size="11" fill="#5f6368">Turns Wi-Fi OFF. Waits for user-defined interval (e.g., 60s). Loop never blocks.</text>

  <!-- Persistence & RAM -->
  <rect x="280" y="410" width="410" height="150" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="295" y="430" font-size="12" font-weight="bold" fill="#c62828">💾 30-Day Resilient Local Storage Engine</text>
  <text x="295" y="450" font-size="11" font-weight="bold" fill="#202124">1. RAM Circular Buffer (Every 5 Minutes):</text>
  <text x="310" y="467" font-size="10" fill="#5f6368">Stores 8,640 samples [timestamp + temp * 10]. Fast, zero wear, instant access.</text>
  <text x="295" y="490" font-size="11" font-weight="bold" fill="#202124">2. LittleFS Flash Persistence (Every 30 Minutes):</text>
  <text x="310" y="507" font-size="10" fill="#5f6368">Flushes RAM history to '/history.bin'. Survives reboots &amp; power losses.</text>
  <text x="295" y="530" font-size="11" font-weight="bold" fill="#202124">3. Local Metrics Computation:</text>
  <text x="310" y="547" font-size="10" fill="#5f6368">Continuously calculates 30-day Min/Max and duration within ±0.5°C band.</text>

  <!-- SECTION 3: OUTPUTS (Right Column) -->
  <rect x="745" y="85" width="230" height="235" rx="10" fill="#fff" stroke="#dadce0" stroke-width="2" filter="url(#dropShadow)"/>
  <rect x="745" y="85" width="230" height="30" rx="10" fill="url(#greenGrad)"/>
  <text x="860" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">☁️ Cloud &amp; Notifications</text>
  <text x="760" y="135" font-size="11" font-weight="bold" fill="#202124">• Google Sheets:</text>
  <text x="770" y="152" font-size="10" fill="#5f6368">Full telemetry row append</text>
  <text x="760" y="175" font-size="11" font-weight="bold" fill="#202124">• Offline Watchdog (Apps Script):</text>
  <text x="770" y="192" font-size="10" fill="#5f6368">Alerts if device silent &gt;10 min</text>
  <text x="760" y="215" font-size="11" font-weight="bold" fill="#202124">• Telegram Bot API:</text>
  <text x="770" y="232" font-size="10" fill="#5f6368">Urgent threshold alarms</text>
  <text x="760" y="255" font-size="11" font-weight="bold" fill="#202124">• Custom Webhook:</text>
  <text x="770" y="272" font-size="10" fill="#5f6368">Home Assistant / REST API</text>
  <text x="760" y="295" font-size="11" font-weight="bold" fill="#202124">• Recovery Alert:</text>
  <text x="770" y="310" font-size="10" fill="#5f6368">Notifies when connection returns</text>

  <rect x="745" y="335" width="230" height="245" rx="10" fill="#fff" stroke="#dadce0" stroke-width="2" filter="url(#dropShadow)"/>
  <rect x="745" y="335" width="230" height="30" rx="10" fill="url(#purpleGrad)"/>
  <text x="860" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">📄 Local Web Audit Portal</text>
  <text x="760" y="385" font-size="11" font-weight="bold" fill="#4a148c">• View / Print PDF (/report):</text>
  <text x="770" y="402" font-size="10" fill="#5f6368">Dynamic Chart.js time-series curve</text>
  <text x="770" y="417" font-size="10" fill="#5f6368">KPI cards &amp; excursion breach table</text>
  <text x="770" y="432" font-size="10" fill="#5f6368">A4 print-ready official report</text>
  <text x="760" y="455" font-size="11" font-weight="bold" fill="#4a148c">• Raw CSV Export (/export_csv):</text>
  <text x="770" y="472" font-size="10" fill="#5f6368">Instant 30-day raw data download</text>
  <text x="760" y="495" font-size="11" font-weight="bold" fill="#4a148c">• Onboard Docs (/about):</text>
  <text x="770" y="512" font-size="10" fill="#5f6368">Offline SVG schematic &amp; specs</text>
  <text x="760" y="535" font-size="11" font-weight="bold" fill="#4a148c">• SoftAP Web Config:</text>
  <text x="770" y="552" font-size="10" fill="#5f6368">192.168.4.1 Wi-Fi &amp; sensor pairing</text>

  <!-- Connectors -->
  <line x1="225" y1="160" x2="260" y2="160" stroke="#1a73e8" stroke-width="2.5" stroke-dasharray="4"/>
  <line x1="225" y1="330" x2="260" y2="330" stroke="#fb8c00" stroke-width="2.5"/>
  <line x1="710" y1="200" x2="745" y2="200" stroke="#34a853" stroke-width="2.5"/>
  <line x1="710" y1="460" x2="745" y2="460" stroke="#8e24aa" stroke-width="2.5"/>
</svg>
